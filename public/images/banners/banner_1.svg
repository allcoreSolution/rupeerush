<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad1)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>

  <!-- Geometric Decorative Lines -->
  <path d="M 0,400 L 400,0 L 450,0 L 50,400 Z" fill="#ffffff" opacity="0.02"/>
  <path d="M 600,400 L 950,0 L 1020,0 L 670,400 Z" fill="#f59e0b" opacity="0.04"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="url(#badgeGrad1)"/>
    <text x="90" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">🔥 OFFICIAL HOURLY</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">2-DIGIT LOTTERY</text>
    <text x="0" y="140" fill="url(#goldGrad1)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">90X MEGA PAYOUT</text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600">Hourly Official Draws (XA – XJ) • Automated Instant Settlement</text>

    <!-- CTA Button -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#goldGrad1)" filter="url(#shadow1)"/>
      <text x="110" y="32" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">PLAY NOW ➔</text>
    </g>

    <!-- Trust Badges -->
    <g transform="translate(245, 230)">
      <text x="0" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✓ 100% Provably Fair  •  ₹10 Min Stake</text>
    </g>
  </g>

  <!-- Right Visual Graphics: 3D Casino Badges & Dice -->
  <g transform="translate(860, 80)" filter="url(#shadow1)">
    <!-- Decorative Gold Ring -->
    <circle cx="120" cy="120" r="110" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6" opacity="0.4"/>
    <circle cx="120" cy="120" r="90" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Big 90X Center -->
    <text x="120" y="110" fill="url(#goldGrad1)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" text-anchor="middle">90X</text>
    <text x="120" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">MULTIPLIER</text>
    <text x="120" y="170" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HOURLY ROUNDS</text>
  </g>

  <!-- Floating Dice / Number Balls -->
  <g transform="translate(740, 60)" filter="url(#shadow1)">
    <circle cx="35" cy="35" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <text x="35" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">XA</text>
  </g>
  <g transform="translate(770, 240)" filter="url(#shadow1)">
    <circle cx="35" cy="35" r="32" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
    <text x="35" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">XJ</text>
  </g>
  <g transform="translate(1080, 210)" filter="url(#shadow1)">
    <circle cx="35" cy="35" r="32" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <text x="35" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle">77</text>
  </g>
</svg>