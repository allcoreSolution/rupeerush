<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#14132b"/>
      <stop offset="100%" stop-color="#2d124d"/>
    </linearGradient>
    <linearGradient id="colorGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="violetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow2" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad2)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#badgeGrad2)"/>
    <text x="95" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">⚡ FAST 30s ROUNDS</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">WINGO COLOR SLOT</text>
    <text x="0" y="140" fill="url(#colorGrad2)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">RED • GREEN • VIOLET</text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600">Pick Colors (2X / 4.5X) or Predict Numbers (9X Jackpot) in 30 Seconds</text>

    <!-- CTA Button -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#violetGrad2)" filter="url(#shadow2)"/>
      <text x="110" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">PLAY WINGO ➔</text>
    </g>

    <!-- Trust Badges -->
    <g transform="translate(245, 230)">
      <text x="0" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✓ Non-stop 24/7 Action  •  Instant Payouts</text>
    </g>
  </g>

  <!-- Right Visual Graphics: 3 Color Badges + Numbers -->
  <g transform="translate(760, 100)" filter="url(#shadow2)">
    <!-- Green Badge -->
    <rect x="0" y="20" width="90" height="110" rx="16" fill="#10b981"/>
    <text x="45" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">2X</text>
    <text x="45" y="100" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">GREEN</text>

    <!-- Violet Badge -->
    <rect x="110" y="0" width="100" height="150" rx="18" fill="#8b5cf6" stroke="#fbbf24" stroke-width="3"/>
    <text x="160" y="65" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle">JACKPOT</text>
    <text x="160" y="105" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" text-anchor="middle">4.5X</text>
    <text x="160" y="132" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">VIOLET</text>

    <!-- Red Badge -->
    <rect x="230" y="20" width="90" height="110" rx="16" fill="#ef4444"/>
    <text x="275" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">2X</text>
    <text x="275" y="100" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">RED</text>
  </g>

  <!-- Number Balls -->
  <g transform="translate(1090, 70)" filter="url(#shadow2)">
    <circle cx="35" cy="35" r="30" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <text x="35" y="44" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" text-anchor="middle">9</text>
  </g>
  <g transform="translate(1080, 240)" filter="url(#shadow2)">
    <circle cx="35" cy="35" r="30" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
    <text x="35" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" text-anchor="middle">0</text>
  </g>
</svg>