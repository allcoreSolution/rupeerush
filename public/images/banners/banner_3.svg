<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14"/>
      <stop offset="50%" stop-color="#0d281e"/>
      <stop offset="100%" stop-color="#043224"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow3" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad3)"/>
  <rect width="1200" height="400" fill="url(#glow3)"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect x="0" y="0" width="200" height="34" rx="17" fill="url(#badgeGrad3)"/>
    <text x="100" y="22" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">⚡ 100% INSTANT &amp; SECURE</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">INSTANT 30s UPI</text>
    <text x="0" y="140" fill="url(#goldGrad3)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">DEPOSITS &amp; CASHOUTS</text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600">GPay, PhonePe, Paytm, BHIM &amp; Direct Bank • 24/7 Fast Withdrawals</text>

    <!-- CTA Button -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="230" height="52" rx="26" fill="url(#emeraldGrad3)" filter="url(#shadow3)"/>
      <text x="115" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">INSTANT DEPOSIT ➔</text>
    </g>

    <!-- Trust Badges -->
    <g transform="translate(255, 230)">
      <text x="0" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✓ ₹0 Withdrawal Fee  •  Auto Approval</text>
    </g>
  </g>

  <!-- Right Visual Graphics: UPI App Icons / Badges -->
  <g transform="translate(800, 90)" filter="url(#shadow3)">
    <!-- Central Shield / Security -->
    <rect x="40" y="10" width="220" height="180" rx="24" fill="#09271d" stroke="#10b981" stroke-width="2"/>
    <circle cx="150" cy="70" r="36" fill="#10b981"/>
    <text x="150" y="79" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" text-anchor="middle">₹</text>
    <text x="150" y="130" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">30 SECONDS</text>
    <text x="150" y="155" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">INSTANT SETTLEMENT</text>
  </g>

  <g transform="translate(730, 230)" filter="url(#shadow3)">
    <rect x="0" y="0" width="90" height="42" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="45" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">GPay</text>
  </g>
  <g transform="translate(840, 230)" filter="url(#shadow3)">
    <rect x="0" y="0" width="105" height="42" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="52" y="26" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">PhonePe</text>
  </g>
  <g transform="translate(965, 230)" filter="url(#shadow3)">
    <rect x="0" y="0" width="90" height="42" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="45" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">Paytm</text>
  </g>
</svg>