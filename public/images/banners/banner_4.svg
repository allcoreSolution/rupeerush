<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f15"/>
      <stop offset="50%" stop-color="#0a2e20"/>
      <stop offset="100%" stop-color="#144d36"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="liveBadgeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="glow4" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad4)"/>
  <rect width="1200" height="400" fill="url(#glow4)"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="url(#liveBadgeGrad4)"/>
    <text x="90" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">🔴 LIVE IN-PLAY 24/7</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900">CRICKET EXCHANGE</text>
    <text x="0" y="140" fill="url(#goldGrad4)" font-family="system-ui, sans-serif" font-size="44" font-weight="900">IPL &amp; WORLD CUP T20</text>

    <text x="0" y="185" fill="#86efac" font-family="system-ui, sans-serif" font-size="19" font-weight="600">Live Ball-by-Ball Scores • Back &amp; Lay Odds • Instant Settlement</text>

    <!-- CTA Button -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#goldGrad4)" filter="url(#shadow4)"/>
      <text x="110" y="32" fill="#000000" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">BET ON CRICKET ➔</text>
    </g>

    <g transform="translate(245, 230)">
      <text x="0" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✓ 98.5% Highest Payout Odds  •  Over &amp; Session Bets</text>
    </g>
  </g>

  <!-- Right Visual: Cricket Odds Back/Lay Boxes & Live Score Mockup -->
  <g transform="translate(800, 75)" filter="url(#shadow4)">
    <rect x="0" y="0" width="340" height="230" rx="20" fill="#091811" stroke="#22c55e" stroke-width="2"/>
    <rect x="15" y="15" width="80" height="26" rx="13" fill="#dc2626"/>
    <text x="55" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LIVE IN-PLAY</text>
    <text x="110" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">T20 INTERNATIONAL</text>

    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">INDIA</text>
    <text x="320" y="75" fill="#fde047" font-family="monospace" font-size="18" font-weight="900" text-anchor="end">186/4 (17.2)</text>

    <text x="20" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18" font-weight="900">AUSTRALIA</text>
    <text x="320" y="115" fill="#94a3b8" font-family="monospace" font-size="16" font-weight="700" text-anchor="end">182/7 (20)</text>

    <!-- Quick Back/Lay Buttons -->
    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="140" height="60" rx="10" fill="#0284c7"/>
      <text x="70" y="24" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BACK INDIA</text>
      <text x="70" y="48" fill="#ffffff" font-family="monospace" font-size="20" font-weight="900" text-anchor="middle">1.85</text>

      <rect x="160" y="0" width="140" height="60" rx="10" fill="#db2777"/>
      <text x="230" y="24" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LAY INDIA</text>
      <text x="230" y="48" fill="#ffffff" font-family="monospace" font-size="20" font-weight="900" text-anchor="middle">1.88</text>
    </g>
  </g>
</svg>