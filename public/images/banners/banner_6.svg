<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d28"/>
      <stop offset="50%" stop-color="#1e1844"/>
      <stop offset="100%" stop-color="#2d1b54"/>
    </linearGradient>
    <linearGradient id="purpleGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="goldGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow6" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad6)"/>
  <rect width="1200" height="400" fill="url(#glow6)"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="url(#purpleGrad6)"/>
    <text x="95" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">♠ PREMIER CASINO</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900">LIVE INDIAN CASINO</text>
    <text x="0" y="140" fill="url(#goldGrad6)" font-family="system-ui, sans-serif" font-size="44" font-weight="900">TEEN PATTI &amp; ANDAR BAHAR</text>

    <text x="0" y="185" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600">Dragon Tiger 50X • European Roulette 36X • 24/7 Live Dealers</text>

    <!-- CTA Button -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#goldGrad6)" filter="url(#shadow6)"/>
      <text x="110" y="32" fill="#000000" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">PLAY TABLES ➔</text>
    </g>

    <g transform="translate(245, 230)">
      <text x="0" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✓ Instant Payouts  •  Real Card History Beads</text>
    </g>
  </g>

  <!-- Right Visual: Cards & Chips -->
  <g transform="translate(820, 80)" filter="url(#shadow6)">
    <!-- Card 1 -->
    <rect x="20" y="10" width="100" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" transform="rotate(-12, 70, 85)"/>
    <text x="45" y="60" fill="#ef4444" font-family="system-ui, sans-serif" font-size="28" font-weight="900" transform="rotate(-12, 70, 85)">A♥</text>
    
    <!-- Card 2 -->
    <rect x="110" y="10" width="100" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" transform="rotate(8, 160, 85)"/>
    <text x="135" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-size="28" font-weight="900" transform="rotate(8, 160, 85)">K♠</text>

    <!-- Casino Chip -->
    <circle cx="250" cy="140" r="45" fill="#f59e0b" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 8"/>
    <text x="250" y="148" fill="#000000" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">5K</text>
  </g>
</svg>